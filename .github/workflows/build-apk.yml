name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android debug key directory
        run: mkdir -p ~/.android

      - name: Restore stable v0.2 debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eversolo-play-history-v0.2-debug-key-v1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eversolo-Play-History-v0.2-beta
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
