plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kyunghoon.eversolohistory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kyunghoon.eversolohistory.v2'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '0.2.1-patch'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
